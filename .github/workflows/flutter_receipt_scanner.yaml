name: flutter_receipt_scanner

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/flutter_receipt_scanner.yaml
      - flutter_receipt_scanner/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/flutter_receipt_scanner.yaml
      - flutter_receipt_scanner/**

jobs:
  build:
    if: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "snyk-bot", "allcontributors[bot]"]'), github.actor) }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@0d81600dd37bc87a473ee5b6e2293bef05751b04 # v1.20.1
    with:
      flutter_version: 3.44.6
      format_line_length: 120
      working_directory: flutter_receipt_scanner
