name: flutter_receipt_scanner_platform_interface

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/flutter_receipt_scanner_platform_interface.yaml
      - flutter_receipt_scanner_platform_interface/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/flutter_receipt_scanner_platform_interface.yaml
      - flutter_receipt_scanner_platform_interface/**

jobs:
  build:
    if: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "snyk-bot", "allcontributors[bot]"]'), github.actor) }}
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@0d81600dd37bc87a473ee5b6e2293bef05751b04 # v1.20.1
    with:
      flutter_version: 3.44.6
      format_line_length: 120
      working_directory: flutter_receipt_scanner_platform_interface
      # Pigeon-generated wire code is a single source of truth regenerated from
      # pigeons/messages.dart; exclude it from the 100% coverage gate rather than
      # hand-testing (or hand-editing) generated output.
      coverage_excludes: "**/*.g.dart"
