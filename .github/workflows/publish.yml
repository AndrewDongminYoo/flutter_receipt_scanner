name: publish

# Automated publishing to pub.dev via GitHub Actions OIDC (no secrets).
#
# One-time setup, per package, on pub.dev › Admin › Automated publishing:
#   - Repository:  AndrewDongminYoo/flutter_receipt_scanner
#   - Tag pattern: <package_name>-v{{version}}
# The first version of each package must be published manually with
# `dart pub publish` before automated publishing can be enabled. See RELEASING.md.
#
# Trigger: push a per-package annotated tag, e.g. flutter_receipt_scanner_ios-v0.1.1.
# Each tag runs only its matching job (guarded by `if`); the tag's version must
# equal the package's pubspec version or pub.dev rejects the publish.

permissions: read-all

on:
  push:
    tags:
      - flutter_receipt_scanner-v[0-9]+.[0-9]+.[0-9]+
      - flutter_receipt_scanner_platform_interface-v[0-9]+.[0-9]+.[0-9]+
      - flutter_receipt_scanner_ios-v[0-9]+.[0-9]+.[0-9]+
      - flutter_receipt_scanner_android-v[0-9]+.[0-9]+.[0-9]+

jobs:
  platform_interface:
    if: startsWith(github.ref, 'refs/tags/flutter_receipt_scanner_platform_interface-v')
    permissions:
      id-token: write # Required for OIDC authentication with pub.dev.
      contents: read # Required for the reusable workflow to check out the repo.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutter_receipt_scanner_platform_interface

  ios:
    if: startsWith(github.ref, 'refs/tags/flutter_receipt_scanner_ios-v')
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutter_receipt_scanner_ios

  android:
    if: startsWith(github.ref, 'refs/tags/flutter_receipt_scanner_android-v')
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutter_receipt_scanner_android

  app:
    if: startsWith(github.ref, 'refs/tags/flutter_receipt_scanner-v')
    permissions:
      id-token: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutter_receipt_scanner
