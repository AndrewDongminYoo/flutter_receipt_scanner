name: flutter_receipt_scanner_android

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/flutter_receipt_scanner_android.yaml
      - flutter_receipt_scanner_android/**
      - pubspec.yaml
      - pubspec.lock
  push:
    branches:
      - main
    paths:
      - .github/workflows/flutter_receipt_scanner_android.yaml
      - flutter_receipt_scanner_android/**

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@33d441b1f92ff046f1945309a204d9ed039e6fc9 # v2.1.0
    with:
      format_line_length: 120
      working_directory: flutter_receipt_scanner_android
