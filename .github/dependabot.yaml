version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    open-pull-requests-limit: 3
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      pub-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      pub-security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: gradle
    directories:
      - /flutter_receipt_scanner/example/android
      - /flutter_receipt_scanner_android/android
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      gradle-security:
        applies-to: security-updates
        patterns:
          - '*'
