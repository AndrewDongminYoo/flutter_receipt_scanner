version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      # Every version update, majors included, in one PR; CI runs the actions it bumps.
      actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      pub-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pub-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: gradle
    directories:
      - /flutter_receipt_scanner/example/android
      - /flutter_receipt_scanner_android/android
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    ignore:
      # Gradle wrapper upgrades follow the Flutter/AGP toolchain, not Dependabot.
      # update-types limits this to version updates; security updates still open.
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"
