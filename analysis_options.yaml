include: package:very_good_analysis/analysis_options.yaml
analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/example/**"
linter:
  rules:
    # Project formats at 120 columns (dart format --line-length 120), so the
    # 80-char lint from very_good_analysis is disabled to match.
    lines_longer_than_80_chars: false
