name: flutter_receipt_scanner
description: On-device receipt capture (camera + gallery) with crop, EXIF, auto-rotate, and Korean/English OCR quality gating.
version: 0.5.0
homepage: https://github.com/AndrewDongminYoo/flutter_receipt_scanner
repository: https://github.com/AndrewDongminYoo/flutter_receipt_scanner
issue_tracker: https://github.com/AndrewDongminYoo/flutter_receipt_scanner/issues
topics:
  - receipt
  - scanner
  - ocr
  - exif
  - document-scanner

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_receipt_scanner_android
      ios:
        default_package: flutter_receipt_scanner_ios

dependencies:
  flutter:
    sdk: flutter
  flutter_receipt_scanner_android: ^0.5.0
  flutter_receipt_scanner_ios: ^0.5.0
  flutter_receipt_scanner_platform_interface: ^0.5.0

dev_dependencies:
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
